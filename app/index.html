const AI_ENDPOINT = '';

const PERSONAS = {

  'Friendship Guide': { emoji: '🤝', system: 'You are Friendship Guide, helping with friendships, boundaries and social connection. Be supportive and direct.' },
};

const OFFLINE = {
  heart: ['Heartbreak hurts because you loved deeply. Give yourself permission to grieve, limit contact for a while, and lean on people who care about you. Healing is not linear, and that is okay.', 'Try writing the unsent letter: say everything you wish you could say, then keep it to yourself. It helps clear the noise so you can heal.'],
  marry: ['Strong marriages are built on small daily habits: honest talks, apologies that mean something, and shared goals. Schedule a weekly check-in where you each share one appreciation and one concern.'],
  trust: ['Trust is rebuilt through consistency, not speeches. Be transparent, keep small promises, and give the other person time to see the change. If you are the one hurt, say clearly what you need to feel safe.'],
  fight: ['When arguments heat up, pause. Say "I want to solve this with you, let us take 20 minutes." Return and use "I feel... when... because..." instead of blaming.'],
  friend: ['Good friendships need reciprocity. Say plainly what you need, and notice who shows up for you. It is fine to let go of those who consistently do not.'],
  love: ['Love grows through attention. Ask real questions, listen without fixing, and show appreciation daily. Learn your partner\'s love language and speak it on purpose.'],
  def: ['Thank you for sharing that. Tell me a bit more: how long has this been going on, and what outcome would feel good to you? Meanwhile, focus on one honest, calm conversation rather than many small hints.'],
};

function offline(text) {
  const t = text.toLowerCase();
  const pick = (k) => OFFLINE[k][Math.floor(Math.random() * OFFLINE[k].length)];
  if (/break|broke|heart|ex\b|miss|cry|lonely/.test(t)) return pick('heart');
  if (/marr|wife|husband|wedding|spouse/.test(t)) return pick('marry');
  if (/trust|cheat|lie|jealous/.test(t)) return pick('trust');
  if (/fight|argu|angry|shout/.test(t)) return pick('fight');
  if (/friend/.test(t)) return pick('friend');
  if (/love|date|crush|romance/.test(t)) return pick('love');
  return pick('def');
}

async function askAI(persona, messages) {
  if (AI_ENDPOINT) {
    try {
      const r = await fetch(AI_ENDPOINT + '/chat', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ persona, system: PERSONAS[persona].system, messages }),
      });
      const j = await r.json();
      if (j.reply) return j.reply;
    } catch (e) { /* fall through */ }
  }
  return offline(messages[messages.length - 1].content);
}

async function getQuote(fresh = false) {
  if (AI_ENDPOINT) {
    try {
      const r = await fetch(AI_ENDPOINT + '/quote', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const j = await r.json();
      if (j.quote) return j.quote;
    } catch (e) { /* fall through */ }
  }
  const day = Math.floor(Date.now() / 86400000);
  return QUOTES[(fresh ? Math.floor(Math.random() * QUOTES.length) : day) % QUOTES.length];
}

async function hash(p){
  const s=p+'::ra_v1';
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}
}

  updateAd();
}
async function loadQuote(fresh){S.saved=false;S.quote='';render();S.quote=await getQuote(fresh);if(S.tab==='home'&&!S.view&&S.user)render()}
async function doAuth(){
  const err=m=>{$('#err').textContent=m};
  const email=($('#f-email').value||'').trim().toLowerCase(), pw=$('#f-pw').value||'';
  const users=store.get('ra:users',{});
  if(S.mode==='up'){
    const name=($('#f-name').value||'').trim();
    if(!name||!email.includes('@')||pw.length<6) return err('Enter your name, a valid email and a password of 6+ characters.');
    if(users[email]) return err('An account with this email already exists. Sign in instead.');
    const u={name,email,joined:new Date().toISOString()};
    users[email]={...u,pw:await hash(pw)}; store.set('ra:users',users); S.user=u;
  }else{
    const rec=users[email], h=await hash(pw);
    if(!rec||rec.pw!==h) return err('Wrong email or password.');
    S.user={name:rec.name,email:rec.email,joined:rec.joined};
  }
  store.set('ra:session',S.user); S.tab='home'; S.view=null; loadQuote(false);
}
async function sendMsg(){
  const inp=$('#chat-in'); const t=(inp&&inp.value||'').trim(); if(!t||S.busy) return;
  const p=S.persona, msgs=S.chats[p]||(S.chats[p]=[greeting(p)]);
  msgs.push({role:'user',content:t}); S.busy=true; render();
  const reply=await askAI(p,msgs.slice(-12));
  msgs.push({role:'assistant',content:reply}); S.busy=false; render();
}
function nextCard(){S.card=S.game==='deep'?rnd(DEEP_Q):S.game==='wyr'?rnd(WYR):rnd(DATES)}
function removeAll(){
  const users=store.get('ra:users',{}); delete users[S.user.email]; store.set('ra:users',users);
  ['ra:session','ra:favs','ra:done:q','ra:done:c'].forEach(store.del);
  S.user=null; S.chats={}; S.mode='in';
}
async function act(a,arg){
  if(a==='mode'){S.mode=S.mode==='in'?'up':'in';render()}
  else if(a==='auth') await doAuth();
  else if(a==='tab'){S.tab=arg;S.view=null;if(arg!=='games')S.game=null;render()}
  else if(a==='open'){S.view=arg;render()}
  else if(a==='back'){S.view=null;render()}
  else if(a==='toggle'){const k='ra:done:'+S.view,d=store.get(k,{});d[arg]=!d[arg];store.set(k,d);render()}
  else if(a==='save'){const f=store.get('ra:favs',[]);if(S.quote&&!f.includes(S.quote)){f.unshift(S.quote);store.set('ra:favs',f)}S.saved=true;render()}
  else if(a==='newq') loadQuote(true);
  else if(a==='persona'){S.persona=arg;render()}
  else if(a==='send') await sendMsg();
  else if(a==='game'){S.game=arg;nextCard();render()}
  else if(a==='next'){nextCard();render()}
  else if(a==='gback'){S.game=null;render()}
  else if(a==='unsave'){const f=store.get('ra:favs',[]);f.splice(+arg,1);store.set('ra:favs',f);render()}
  else if(a==='signout'){store.del('ra:session');S.user=null;S.mode='in';S.chats={};render()}
  else if(a==='delete'){
    if(confirm('Delete your account? This permanently erases your account, saved quotes and progress from this browser. This cannot be undone.')&&confirm('Are you sure? All your data will be erased.')){removeAll();render()}
  }
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t){e.preventDefault();act(t.dataset.act,t.dataset.arg)}});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  if(e.target.id==='chat-in'){e.preventDefault();sendMsg()}
  else if(e.target.id==='f-pw'||e.target.id==='f-email'||e.target.id==='f-name'){e.preventDefault();doAuth()}
});
if(S.user) loadQuote(false); else render();
</script>
</body>
</html>
