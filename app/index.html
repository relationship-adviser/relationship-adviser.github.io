<style>

const QUESTIONS = [
  {q:'What does a happy marriage look like to you, day to day?', d:'This shows if you both want the same daily life. One person may want quiet evenings at home while the other wants constant social life. Discuss chores, routines, and what a normal Tuesday looks like, not just holidays.'},
  {q:'Do you want children? How many, and when?', d:'One of the biggest deal-breakers. Be specific about timing, parenting style, adoption, and what happens if you struggle to have kids. Do not leave this as we will see later.'},
  {q:'How will we handle money: joint accounts, budgets, savings, debts?', d:'Money fights destroy marriages. Share your debts, income, spending habits, and family support obligations. Agree if you will have joint account, separate, or both, and who pays for what.'},
  {q:'How do you handle conflict, and what do you need when we disagree?', d:'Do you shout, shut down, or talk calmly? Knowing each others conflict style helps you create a rule: we take 20 minutes break and return to talk with respect, no insults.'},
  {q:'What are your career goals, and would you relocate for either of us?', d:'If one gets a job in Lagos and the other in Aba, what happens? Support each others ambition and agree how you handle promotions, business risk, and relocation.'},
  {q:'How involved will our families be in our lives and decisions?', d:'In our culture family is close. Decide boundaries for in-laws visits, financial support, and who makes final decisions in your own home as a couple.'},
  {q:'What are our expectations for household chores and responsibilities?', d:'Love fades when one person does everything. List cooking, cleaning, child care, and share fairly. Revisit every 6 months.'},
  {q:'What role does faith or spirituality play in your life?', d:'If you have different beliefs, how will you pray, go to church, and raise children? Respect is key, but you must agree on practice.'},
  {q:'What are your deal-breakers in a marriage?', d:'Cheating, lying, addiction, abuse — say clearly what ends the marriage for you. It is better to be honest now than shocked later.'},
  {q:'How do you feel about intimacy and what are your expectations?', d:'Talk about needs, frequency, boundaries, and how you keep romance alive when stressed or after children. Honest talk prevents resentment.'},
  {q:'Is there any debt, health condition or past matter I should know about?', d:'Transparency builds trust. Share health history, mental health, past marriage, or debt. Secrets discovered later feel like betrayal.'},
  {q:'How do we make big decisions together?', d:'Will you vote, let one person decide, or talk until agreement? Big decisions need a process so no one feels ignored.'},
  {q:'How do you feel about friendships with the opposite sex?', d:'Set clear boundaries that both feel safe with. What is okay on social media, going out, and privacy.'},
  {q:'What does loyalty and faithfulness mean to you?', d:'Define faithfulness beyond physical. Is emotional chatting cheating? Is porn okay? Define it together.'},
  {q:'How will we parent, and what values do we want to pass on?', d:'Strict or gentle parenting? How to discipline, educate, and what values matter most: honesty, hard work, faith.'},
  {q:'How do you recharge: alone time, together time, social time?', d:'Introverts need alone time, extroverts need people. Respect each others battery and plan both together and alone time.'},
  {q:'How do you feel about social media and privacy in a relationship?', d:'Can you post each other, share passwords, or keep privacy? Social media causes fights when not discussed.'},
  {q:'What are your biggest fears about marriage?', d:'Sharing fears brings you closer. Fear of divorce, of losing freedom, of being like your parents — say it out loud.'},
  {q:'How will we support each other through illness, loss or hard times?', d:'Love is tested in hard times. How will you show up when one is sick, loses job, or loses family member?'},
  {q:'Where do you see us in 5, 10 and 20 years?', d:'Vision aligns effort. If one sees village quiet life and other sees city business empire, you need to align now.'},
];
const CONSIDER = [
  {q:'Do they respect you, especially when you disagree?', d:'Respect is how they talk when angry. If they insult, belittle, or ignore your opinion now, marriage will magnify it.'},
  {q:'Do you feel safe, emotionally and physically, around them?', d:'Safety is the foundation. You should not feel anxious, walking on eggshells, or afraid to say truth.'},
  {q:'Are their values and life goals compatible with yours?', d:'Love is not enough if you want different lives. Check faith, family, career, children, lifestyle.'},
  {q:'Are they honest, even when the truth is uncomfortable?', d:'Small lies now become big lies later. Notice if they tell truth when it costs them.'},
  {q:'Do they take responsibility and apologise sincerely?', d:'Sorry without change is manipulation. Look for sorry, changed behavior, and consistency.'},
  {q:'How do they treat family, friends, waiters and strangers?', d:'How they treat people with no power over them shows character.'},
  {q:'Are you yourself around them, or performing?', d:'If you hide your true self to be loved, you will be tired for life. Love should feel like freedom.'},
  {q:'Are you ready for a relationship, or just avoiding loneliness?', d:'Loneliness makes us choose wrong. Heal first, then choose.'},
  {q:'Have you healed from your last relationship?', d:'Unhealed wounds bleed on new partners. Take time to heal from heartbreak before saying yes.'},
  {q:'Do they communicate openly rather than going silent or blowing up?', d:'Healthy communication is clear, calm, and consistent, not silent treatment or shouting.'},
  {q:'Is the effort mutual, or are you doing all the work?', d:'If you are always texting first, planning, apologizing, it is one-sided. Love should be mutual effort.'},
  {q:'Do they support your growth, dreams and independence?', d:'A good partner claps for you, not competes with you. They want you to grow.'},
  {q:'How do they handle money and responsibilities?', d:'Are they responsible with money, bills, promises? Money habits now predict marriage habits.'},
  {q:'Are there red flags you keep explaining away?', d:'Your gut knows. If you keep defending their bad behavior to friends, listen to your gut.'},
  {q:'Do your friends and family have honest concerns? Listen to them.', d:'Love is blind but people who love you see clearly. If many people worry, pause and listen.'},
  {q:'Do you share the same intentions: casual, serious, marriage?', d:'Do not assume. Ask: what are we? Where is this going? Align intentions.'},
  {q:'Are they emotionally available and consistent?', d:'Hot today cold tomorrow is not love, it is confusion. Look for steady, consistent care.'},
  {q:'Do you laugh together and enjoy each others company?', d:'Marriage is long. You need friendship and laughter, not just passion.'},
  {q:'How do they handle stress, anger and disappointment?', d:'Watch them when stuck in traffic, when they fail, when stressed. That is who you marry.'},
  {q:'Does your gut feel peaceful or anxious about this person?', d:'Peace is a sign. Constant anxiety, even with butterflies, is a warning.'},
];
const DEEP_Q=["What is a small thing I do that makes you feel loved?","What is your favourite memory of us so far?","What is one thing you wish we did more often?","When did you first know you liked me?","What is something you have never told me?","What dream have you been afraid to say out loud?","What do you need most from me when you are stressed?","What is one thing I could do better, said kindly?","What does home mean to you?","What are three things you are grateful for in us?","What would our perfect lazy Sunday look like?","What is one fear you have about our future?"];
const WYR=[["Travel the world together for a year","Build your dream home together"],["Know every thought of your partner","Never argue again"],["Cook every meal together","Eat out every night"],["Relive our first date","Skip ahead to our 50th anniversary"],["A surprise party","A quiet candlelit dinner"],["Always text first","Always be texted first"],["A holiday at the beach","A holiday in the mountains"],["Handwritten love letters","A song written for you"]];
const DATES=["Cook a new recipe together 🍝","Sunset walk, phones off 🌇","Movie marathon with homemade popcorn 🍿","Picnic in a park 🧺","Stargazing with a blanket ✨","Dance in the living room 💃","Write letters to your future selves 💌","Visit a place you have never been 🗺️","Game night with a forfeit 🎲","Recreate your first date 💘","Breakfast in bed 🥞","Take couple photos and make an album 📸"];

const PERSONAS={'Love Coach':{emoji:'💘',system:'You are Love Coach, a warm, practical dating and romance adviser.'},'Heartbreak Healer':{emoji:'💔',system:'You are Heartbreak Healer, a gentle adviser helping through breakups.'},'Marriage Counselor':{emoji:'💍',system:'You are Marriage Counselor, calm adviser on marriage.'},'Friendship Guide':{emoji:'🤝',system:'You are Friendship Guide, helping with friendships.'}};
const OFFLINE={heart:['Heartbreak hurts because you loved deeply. Give yourself permission to grieve.'],marry:['Strong marriages are built on small daily habits: honest talks, apologies, shared goals.'],trust:['Trust is rebuilt through consistency, not speeches.'],fight:['When arguments heat up, pause. Take 20 minutes then return.'],friend:['Good friendships need reciprocity.'],love:['Love grows through attention.'],def:['Thank you for sharing that. Tell me a bit more.']};
function offline(text){const t=text.toLowerCase();const pick=k=>OFFLINE[k][Math.floor(Math.random()*OFFLINE[k].length)];if(/break|broke|heart|ex\b|miss|cry|lonely/.test(t)) return pick('heart');if(/marr|wife|husband|wedding|spouse/.test(t)) return pick('marry');if(/trust|cheat|lie|jealous/.test(t)) return pick('trust');if(/fight|argu|angry|shout/.test(t)) return pick('fight');if(/friend/.test(t)) return pick('friend');if(/love|date|crush|romance/.test(t)) return pick('love');return pick('def');}
async function askAI(persona,messages){if(AI_ENDPOINT){try{const r=await fetch(AI_ENDPOINT+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({persona,system:PERSONAS[persona].system,messages})});const j=await r.json();if(j.reply) return j.reply;}catch(e){}}return offline(messages[messages.length-1].content);}
const QUOTES=['Love is not about finding someone to live with, but someone you cannot imagine living without.','A good relationship is two people choosing each other again, every ordinary day.','Communication is the oxygen of love.','Do not look for a perfect partner. Build a perfect understanding.','Real love listens first, and speaks to heal rather than to win.','The best marriages are friendships that learned to dance.','Healing after heartbreak begins the day you stop asking why me and start asking what now.','Respect is the quiet foundation under every lasting love.','You cannot pour love from an empty cup.','Forgiveness is a gift to the relationship, and to yourself.','Love grows in the small things: the text, the tea, the patience.','Trust takes years to build, seconds to break, and forever to repair.','Loving someone means seeing their flaws clearly and choosing them anyway.','Disagreement is not the enemy of love. Contempt is.','A relationship thrives where both people feel safe to be honest.'];
async function getQuote(fresh=false){if(AI_ENDPOINT){try{const r=await fetch(AI_ENDPOINT+'/quote',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const j=await r.json();if(j.quote) return j.quote;}catch(e){}}const day=Math.floor(Date.now()/86400000);return QUOTES[(fresh?Math.floor(Math.random()*QUOTES.length):day)%QUOTES.length];}

async function hash(p){const s=p+'::ra_v1';try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return 'f'+h}}

const S={user:store.get('ra:session',null),tab:'home',view:null,mode:'in',quote:'',saved:false,persona:Object.keys(PERSONAS)[0],chats:{},busy:false,game:null,card:null};

function homeView(){return `<p class="muted">Hello, ${esc(S.user.name.split(' ')[0])}</p><h1>Love, with clarity</h1><div class="quote"><div class="rose b">Today's quote</div><p class="qt">“${esc(S.quote||'…')}”</p><div class="row"><a data-act="save">${S.saved?'❤️ Saved':'🤍 Save'}</a><a data-act="newq">✨ New quote</a></div></div>${tile('💍','20 questions before marriage','Full guide with explanations — 800+ words.','open','q-detail')}${tile('🚦','20 things before saying yes','Checklist with why each matters.','open','c-detail')}${tile('💬','Talk to an adviser','Love, heartbreak, marriage and friendship.','tab','chat')}${tile('🎲','Couple games','Deep questions, would-you-rather, date night spinner.','tab','games')}<div class="card static article"><h2>About this app</h2><p class="lead">Relationship Adviser helps you make clear decisions in love. We combine expert-backed questions, daily quotes, and AI advisers to help you understand your relationship. Whether you are dating, heartbroken, or preparing for marriage, you get practical guidance without judgment. All advice is for education only, not professional therapy.</p></div>`;}

function detailView(type){

  <div class="card static article"><h2>How to use this list</h2><p>1. Read alone first and note your answers. 2. Sit with your partner in a calm place without phones. 3. Take turns answering. 4. If you disagree, ask why, not who is right. 5. Save your progress by tapping each item. 6. If you feel confused, talk to our Love Coach or Heartbreak Healer for personalized advice.</p><p>This article is for education and does not replace professional counseling. If you feel unsafe in your relationship, please reach out to trusted family or local support services.</p></div>
  <button class="btn" data-act="tab" data-arg="chat">Talk to an Adviser about this</button>
  <p class="foot"><a href="${PLAY}" target="_blank">Get Android App</a><a href="${PRIVACY}" target="_blank">Privacy</a></p></div>`;
}
function listView(){const k=S.view, items=k==='q'?QUESTIONS:CONSIDER, done=store.get('ra:done:'+k,{});const n=Object.values(done).filter(Boolean).length;return `<a class="back" data-act="back">← Back</a><h1>${k==='q'?'20 Questions Before Marriage':'20 Things To Consider'}</h1><p class="muted" style="margin-bottom:12px">${n} of ${items.length} covered. Tap to tick off.</p>${items.map((o,i)=>`<div class="item ${done[i]?'done':''}" data-act="toggle" data-arg="${i}"><div>${done[i]?'✅':'⬜'}</div><div>${i+1}. ${esc(o.q)}</div></div>`).join('')}`;}
function greeting(p){return {role:'assistant',content:`Hi, I'm ${p} ${PERSONAS[p].emoji}. What's on your heart today?`}}
function chatView(){const p=S.persona, msgs=S.chats[p]||[greeting(p)];return `<h1>Advisers</h1><div class="chips">${Object.keys(PERSONAS).map(n=>`<div class="chip ${n===p?'on':''}" data-act="persona" data-arg="${esc(n)}">${PERSONAS[n].emoji} ${esc(n)}</div>`).join('')}</div><div class="chat"><div class="msgs" id="msgs">${msgs.map(m=>`<div class="m ${m.role==='user'?'u':''}">${esc(m.content)}</div>`).join('')}${S.busy?'<div class="muted small">typing…</div>':''}</div><div class="send"><input id="chat-in" placeholder="Type your message…" autocomplete="off"><button class="btn" data-act="send">Send</button></div></div>`;}
function gamesView(){if(!S.game) return `<h1>Couple games</h1>${tile('🃏','Deep questions','Take turns answering honestly.','game','deep')}${tile('⚖️','Would you rather','Pick one, then explain why.','game','wyr')}${tile('🎡','Date night spinner','Let fate choose your next date.','game','date')}<div class="card static article"><p class="lead">Couple games help you talk about things you normally avoid. Set 30 minutes, no phones, and take turns. These games build emotional intimacy, which is key for long-term love.</p></div>`;const c=S.card;const body=S.game==='wyr'&&c?`${esc(c[0])}<div class="rose" style="margin:12px 0">or</div>${esc(c[1])}`:esc(c||'');return `<h1>Couple games</h1><div class="gamecard"><div>${body}</div></div><button class="btn" data-act="next">${S.game==='date'?'Spin again':'Next card'}</button><a class="link c" data-act="gback">Back to games</a>`;}
function profileView(){const u=S.user, favs=store.get('ra:favs',[]);const cnt=k=>Object.values(store.get('ra:done:'+k,{})).filter(Boolean).length;return `<div class="c" style="margin-bottom:18px"><div class="av">${esc((u.name.trim()[0]||'❤').toUpperCase())}</div><h1 style="margin-bottom:2px">${esc(u.name)}</h1><div class="muted">${esc(u.email)}</div><div class="muted small">Member since ${esc(new Date(u.joined).toLocaleDateString())}</div></div><div class="card static"><h2>Your progress</h2><p>Questions before marriage: ${cnt('q')}/20</p><p>Relationship checklist: ${cnt('c')}/20</p></div><div class="card static"><h2>Saved quotes (${favs.length})</h2>${favs.length?favs.map((f,i)=>`<p style="color:var(--fg);font-style:italic;margin:8px 0">“${esc(f)}” <a class="rose small" style="cursor:pointer;font-style:normal" data-act="unsave" data-arg="${i}">Remove</a></p>`).join(''):'<p>Tap “Save” on a quote on the Home tab and it will appear here.</p>'}</div><button class="btn" data-act="signout">Sign out</button><button class="btn out" data-act="delete">Delete my account</button><p class="foot"><a href="${PLAY}" target="_blank" rel="noopener">Get the Android app</a><a href="${PRIVACY}" target="_blank" rel="noopener">Privacy</a><a href="${DELETEP}" target="_blank" rel="noopener">Data deletion</a><a href="mailto:devjuli311@gmail.com">Contact</a></p>${ADS_READY?'<p class="muted c small" style="margin-top:14px">Ads on this site are provided by Google AdSense and are non-personalized.</p>':''}<p class="muted c small" style="margin-top:14px">Relationship Adviser offers general guidance, not professional therapy. If you are in danger, contact local emergency services.<br>© 2026 Elite Tech Group</p>`;}

function render(){
  const v=$('#view'), nv=$('#nav');
  if(!S.user){v.innerHTML=authView();nv.innerHTML='';updateAd();return}
  let body;
  if(S.view==='q-detail') body=detailView('q');
  else if(S.view==='c-detail') body=detailView('c');
  else if(S.view) body=listView();
  else body={home:homeView,chat:chatView,games:gamesView,profile:profileView}[S.tab]();
  const t=(id,e,l)=>`<a class="${S.tab===id&&!S.view?'on':''}" data-act="tab" data-arg="${id}"><span>${e}</span>${l}</a>`;
  v.innerHTML=`<main>${body}</main>`;
  nv.innerHTML=`<nav>${t('home','🏠','Home')}${t('chat','💬','Advisers')}${t('games','🎲','Games')}${t('profile','👤','Profile')}</nav>`;
  const m=$('#msgs'); if(m) m.scrollTop=m.scrollHeight;
  window.scrollTo(0,0);
  updateAd();
}
async function loadQuote(fresh){S.saved=false;S.quote='';render();S.quote=await getQuote(fresh);if(S.tab==='home'&&!S.view&&S.user)render()}
async function doAuth(){
  const err=m=>{$('#err').textContent=m};
  const email=($('#f-email').value||'').trim().toLowerCase(), pw=$('#f-pw').value||'';
  const users=store.get('ra:users',{});
  if(S.mode==='up'){
    const name=($('#f-name').value||'').trim();
    if(!name||!email.includes('@')||pw.length<6) return err('Enter your name, a valid email and a password of 6+ characters.');
    if(users[email]) return err('An account with this email already exists. Sign in instead.');
    const u={name,email,joined:new Date().toISOString()};
    users[email]={...u,pw:await hash(pw)}; store.set('ra:users',users); S.user=u;
  }else{
    const rec=users[email], h=await hash(pw);
    if(!rec||rec.pw!==h) return err('Wrong email or password.');
    S.user={name:rec.name,email:rec.email,joined:rec.joined};
  }
  store.set('ra:session',S.user); S.tab='home'; S.view=null; loadQuote(false);
}
async function sendMsg(){
  const inp=$('#chat-in'); const t=(inp&&inp.value||'').trim(); if(!t||S.busy) return;
  const p=S.persona, msgs=S.chats[p]||(S.chats[p]=[greeting(p)]);
  msgs.push({role:'user',content:t}); S.busy=true; render();
  const reply=await askAI(p,msgs.slice(-12));
  msgs.push({role:'assistant',content:reply}); S.busy=false; render();
}
function nextCard(){S.card=S.game==='deep'?rnd(DEEP_Q):S.game==='wyr'?rnd(WYR):rnd(DATES)}
function removeAll(){
  const users=store.get('ra:users',{}); delete users[S.user.email]; store.set('ra:users',users);
  ['ra:session','ra:favs','ra:done:q','ra:done:c'].forEach(store.del);
  S.user=null; S.chats={}; S.mode='in';
}
async function act(a,arg){
  if(a==='mode'){S.mode=S.mode==='in'?'up':'in';render()}
  else if(a==='auth') await doAuth();
  else if(a==='tab'){S.tab=arg;S.view=null;if(arg!=='games')S.game=null;render()}
  else if(a==='open'){S.view=arg;render()}
  else if(a==='back'){S.view=null;render()}
  else if(a==='toggle'){const k='ra:done:'+S.view,d=store.get(k,{});d[arg]=!d[arg];store.set(k,d);render()}
  else if(a==='save'){const f=store.get('ra:favs',[]);if(S.quote&&!f.includes(S.quote)){f.unshift(S.quote);store.set('ra:favs',f)}S.saved=true;render()}
  else if(a==='newq') loadQuote(true);
  else if(a==='persona'){S.persona=arg;render()}
  else if(a==='send') await sendMsg();
  else if(a==='game'){S.game=arg;nextCard();render()}
  else if(a==='next'){nextCard();render()}
  else if(a==='gback'){S.game=null;render()}
  else if(a==='unsave'){const f=store.get('ra:favs',[]);f.splice(+arg,1);store.set('ra:favs',f);render()}
  else if(a==='signout'){store.del('ra:session');S.user=null;S.mode='in';S.chats={};render()}
  else if(a==='delete'){if(confirm('Delete your account? This permanently erases your account, saved quotes and progress from this browser. This cannot be undone.')&&confirm('Are you sure? All your data will be erased.')){removeAll();render()}}
}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(t){e.preventDefault();act(t.dataset.act,t.dataset.arg)}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter') return;if(e.target.id==='chat-in'){e.preventDefault();sendMsg()}else if(e.target.id==='f-pw'||e.target.id==='f-email'||e.target.id==='f-name'){e.preventDefault();doAuth()}});
if(S.user) loadQuote(false); else render();
</script>
</body>
  </html>
